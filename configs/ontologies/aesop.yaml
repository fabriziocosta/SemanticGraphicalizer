name: aesop-narrative
version: "2.0"
terms:
  - id: Character
    description: An entity that participates in a narrative.
  - id: Animal
    description: A non-human animal character or animal entity.
  - id: Human
    description: A human character or human entity.
  - id: Object
    description: A physical or symbolic object in the tale.
  - id: Place
    description: A location or setting in the tale.
  - id: Action
    description: An event or action performed by an entity.
  - id: Goal
    description: A desired outcome or intention of a character.
  - id: Trait
    description: A characteristic attributed to a character.
  - id: Moral
    description: An explicit or inferred lesson of the tale.
argument_roles:
  - id: actor
    description: Entity performing or initiating an action.
  - id: target
    description: Entity receiving or affected by an action.
  - id: performer
    description: Entity performing an action.
  - id: action
    description: Action being performed.
  - id: bearer
    description: Entity bearing a property or trait.
  - id: trait
    description: Trait associated with an entity.
  - id: cause
    description: Cause side of a causal assertion.
  - id: effect
    description: Effect side of a causal assertion.
  - id: holder
    description: Entity holding a goal or desire.
  - id: goal
    description: Goal held by an entity.
  - id: subject
    description: Subject of a location or teaching assertion.
  - id: place
    description: Place associated with an entity or action.
  - id: moral
    description: Moral conveyed by a narrative element.
  - id: earlier
    description: Earlier member of a temporal relation.
  - id: later
    description: Later member of a temporal relation.
relations:
  interacts_with:
    description: A character or entity interacts with another entity.
    arguments:
      actor: {cardinality: 1, allowed_types: [Character, Animal, Human, Object]}
      target: {cardinality: 1, allowed_types: [Character, Animal, Human, Object]}
    projection: [actor, target]
  performs:
    description: An entity performs an action.
    arguments:
      performer: {cardinality: 1, allowed_types: [Character, Animal, Human]}
      action: {cardinality: 1, allowed_types: [Action]}
    projection: [performer, action]
  wants:
    description: A character has a goal or desire.
    arguments:
      holder: {cardinality: 1, allowed_types: [Character, Animal, Human]}
      goal: {cardinality: 1, allowed_types: [Goal]}
    projection: [holder, goal]
  located_in:
    description: An entity or action occurs in a place.
    arguments:
      subject: {cardinality: 1, allowed_types: [Character, Animal, Human, Action]}
      place: {cardinality: 1, allowed_types: [Place]}
    projection: [subject, place]
  has_trait:
    description: A character is described as having a trait.
    arguments:
      bearer: {cardinality: 1, allowed_types: [Character, Animal, Human]}
      trait: {cardinality: 1, allowed_types: [Trait]}
    projection: [bearer, trait]
  causes:
    description: A semantic object causes an outcome or event.
    arguments:
      cause: {cardinality: 1}
      effect: {cardinality: 1}
    projection: [cause, effect]
  teaches:
    description: A tale or narrative element conveys a moral.
    arguments:
      subject: {cardinality: 1, allowed_types: [Character, Action, Moral]}
      # Narrative models may classify an expressed lesson as Moral or Trait;
      # both are valid semantic objects for this domain relation.
      moral: {cardinality: 1, allowed_types: [Moral, Trait]}
    projection: [subject, moral]
  before:
    description: One event or assertion occurs before another.
    arguments:
      earlier: {cardinality: 1}
      later: {cardinality: 1}
  after:
    description: One event or assertion occurs after another.
    arguments:
      later: {cardinality: 1}
      earlier: {cardinality: 1}
