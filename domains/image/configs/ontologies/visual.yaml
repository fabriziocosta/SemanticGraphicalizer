name: generic-visual
version: "1.4"
terms:
  - id: scene
    description: The full image scene and its background context.
  - id: visual_entity
    description: A visible foreground entity when no more specific type applies.
  - id: person
    description: A human being, including visible body parts and clothing as attributes.
  - id: animal
    description: A non-human animal, including visible pose and action as attributes.
  - id: plant
    description: A plant, tree, flower, crop, or other visible vegetation.
  - id: vehicle
    description: A vehicle used for transport, including cars, bicycles, boats, and aircraft.
  - id: tool
    description: An implement or device used to perform a task.
  - id: building
    description: A building or constructed structure such as a house, shop, or shed.
  - id: road
    description: A road, path, sidewalk, or other visible route through a scene.
  - id: furniture
    description: A movable furnishing such as a chair, table, bench, or cabinet.
  - id: object
    description: A distinct visible inanimate object not covered by a more specific type.
  - id: landscape_feature
    description: A natural or built environmental feature such as a hill, river, fence, or wall.
  - id: chair
    description: An office chair or other seat used by a person at a desk or table.
  - id: desk
    description: A work desk or workstation surface used for office tasks.
  - id: table
    description: A table used in an office, such as a meeting or side table.
  - id: monitor
    description: A standalone computer display screen.
  - id: computer
    description: A desktop computer or computer tower.
  - id: laptop
    description: A portable computer with an attached screen and keyboard.
  - id: keyboard
    description: A physical computer keyboard.
  - id: mouse
    description: A computer pointing device, including a wired or wireless mouse.
  - id: printer
    description: An office printer, copier, or combined print and scan device.
  - id: telephone
    description: An office telephone or desk phone.
  - id: filing_cabinet
    description: A cabinet with drawers used to store office files or supplies.
  - id: shelf
    description: A shelf or shelving unit used to store books, files, or office items.
  - id: bookshelf
    description: A bookcase or shelving unit primarily used to store books.
  - id: whiteboard
    description: A whiteboard or writable presentation board.
  - id: desk_lamp
    description: A small adjustable lamp placed on a desk or work surface.
  - id: table_lamp
    description: A portable lamp designed to stand on a table, desk, or other surface.
  - id: cup
    description: A small drinking vessel with or without a handle, such as a coffee cup or mug.
  - id: drinking_glass
    description: A drinking vessel made of glass or another transparent material.
  - id: document
    description: A visible sheet, folder, notebook, or other office document.
  - id: office_supply
    description: A small office item such as a pen, stapler, tape dispenser, or paper clip.
argument_roles:
  - id: container
    description: The whole or spatial context containing another entity.
  - id: item
    description: The entity contained by, located in, or related to another entity.
  - id: subject
    description: The first entity in a spatial or interaction relation.
  - id: object
    description: The second entity in a spatial or interaction relation.
relations:
  contains:
    description: One entity or scene contains another entity.
    arguments:
      container:
        cardinality: 1
        allowed_types: [scene, visual_entity, person, animal, plant, vehicle, tool, building, road, furniture, object, landscape_feature, chair, desk, table, monitor, computer, laptop, keyboard, mouse, printer, telephone, filing_cabinet, shelf, bookshelf, whiteboard, desk_lamp, table_lamp, cup, drinking_glass, document, office_supply]
      item:
        cardinality: 1..n
        allowed_types: &visual_types [visual_entity, person, animal, plant, vehicle, tool, building, road, furniture, object, landscape_feature, chair, desk, table, monitor, computer, laptop, keyboard, mouse, printer, telephone, filing_cabinet, shelf, bookshelf, whiteboard, desk_lamp, table_lamp, cup, drinking_glass, document, office_supply]
  near:
    description: Two entities are close to one another.
    arguments:
      subject:
        cardinality: 1
        allowed_types: *visual_types
      object:
        cardinality: 1
        allowed_types: *visual_types
  left_of:
    description: The subject is visually left of the object.
    arguments:
      subject:
        cardinality: 1
        allowed_types: *visual_types
      object:
        cardinality: 1
        allowed_types: *visual_types
  right_of:
    description: The subject is visually right of the object.
    arguments:
      subject:
        cardinality: 1
        allowed_types: *visual_types
      object:
        cardinality: 1
        allowed_types: *visual_types
  in_front_of:
    description: The subject appears in front of the object.
    arguments:
      subject:
        cardinality: 1
        allowed_types: *visual_types
      object:
        cardinality: 1
        allowed_types: *visual_types
  behind:
    description: The subject appears behind the object.
    arguments:
      subject:
        cardinality: 1
        allowed_types: *visual_types
      object:
        cardinality: 1
        allowed_types: *visual_types
  interacting_with:
    description: The subject visibly interacts with the object.
    arguments:
      subject:
        cardinality: 1
        allowed_types: *visual_types
      object:
        cardinality: 1
        allowed_types: *visual_types
