domain: aesop-narrative
version: "2.1"
stages:
  summarize:
    system: >-
      You summarize narrative text while preserving every entity, event,
      state, assertion, qualification, and source distinction.
    instruction: |
      Ontology:
      {ontology}

      Source text:
      {text}
    output: Return JSON with one non-empty string field named summary.
  normalize:
    system: >-
      You normalize a summary into precise ontology-aligned prose without
      inventing entities or relations.
    instruction: |
      Ontology:
      {ontology}

      Summary:
      {text}
    output: Return JSON with one non-empty string field named normalized.
  decompose:
    system: >-
      You decompose normalized text into source-grounded semantic assertions.
    instruction: |
      Each assertion must express one claim and preserve modality, negation,
      attribution, qualification, and source wording.

      Ontology:
      {ontology}

      Normalized text:
      {text}
    output: >-
      Return JSON with an assertions list. Every item must contain id, text,
      source_text, and an attributes object.
  extract:
    system: >-
      You extract atomic Entities and reified relation instances with named
      arguments from the assertions.
    instruction: |
      Use only configured Entity types, relation types, and argument roles.
      Every relation argument entity_id must reference an entity or relation
      id in this response. Use the exact local id from that entity or relation
      item. Assertion ids identify claims in the input and are not entity or
      relation ids; never use an assertion id as an argument entity_id.
      Relations may reference other relations. If validation feedback follows
      the assertions, correct the cited IDs; omit a relation if its target is
      not defined in this response.
      Do not infer relations unsupported by the source assertions.

      Ontology:
      {ontology}

      Assertions:
      {text}
    output: >-
      Return JSON with entities and relations lists. Entity items contain id,
      type, mention, key, and attributes. Relation items contain id, type,
      relation, arguments [{role, entity_id, attributes}], and attributes.
  resolve:
    system: >-
      You identify only explicit cross-chunk or higher-order relations that
      are supported by the document and reference known graph objects.
    instruction: |
      Use configured relation schemas and argument roles. Known IDs include
      atomic entities and already extracted relation entities. Every argument
      must exactly match one of those IDs, or the id of another relation in
      your response. Do not invent or modify IDs. If validation feedback is
      included after the graph context, correct the cited error. Return no
      relation when the text does not support it or its arguments cannot be
      referenced.

      Ontology:
      {ontology}

      Existing graph objects:
      {text}
    output: >-
      Return JSON with a relations list. Each relation contains id, type,
      relation, arguments, and attributes.
