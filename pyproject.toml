[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-graphicalizer"
version = "0.1.0"
description = "Ontology-guided text graphicalization as a scikit-learn transformer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "openai>=1.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "nbclient>=0.8",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["semantic_graphicalizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
